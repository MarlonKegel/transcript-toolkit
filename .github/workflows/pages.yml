# Publishes the docs as a plain website, so `marlonkegel.github.io/transcript-toolkit` can be
# pasted into a chat assistant (ordinary web pages are far more fetchable than github.com's
# JavaScript-rendered file views). It also serves llms.txt / llms-full.txt from the site root.
#
# ONE-TIME SETUP: repo Settings -> Pages -> Source: "GitHub Actions". Until that is switched on
# this workflow will fail; nothing else depends on it.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown
      - name: build the site
        run: python scripts/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
