# Advanced settings for `toolkit locations`. You normally don't touch these.

prompt: tag_locations.md              # in prompts/
justify_prompt: prompt_addendums/justify_locations.md  # appended for demo runs (per-place justifications)
verbosity: low
max_workers: 12
regions_file: locations/regions.yaml            # the region vocabulary (strict enum)
region_map_file: locations/region_to_country.csv
demo_n_clips: 25                  # clips tagged by `toolkit locations tag --demo`
demo_seed: 0
poll_interval_s: 4
max_total_wait_s: 600          # give up on one stuck call; re-run resumes free

# What `toolkit locations thresholds` draws, per rollup method. A run can override any of these
# with --bins / --ranges / --flat.
compare:
  bins: [5, 9]                    # how many rarity bins, for the two binned methods
  ranges: [[10, 30], [20, 40]]    # lowest and highest threshold, per range compared
  flat: [20, 30, 40]              # the single thresholds compared for the flat method

# `toolkit locations survey` (optional offline NER pass; needs `pip install transcript-toolkit[survey]`
# plus the spaCy model and a GeoNames dump — see docs/steps/locations.md).
survey:
  spacy_model: en_core_web_trf
  place_labels: [GPE, LOC]
  speaker_roles: [Narrator]
  geonames_dir: null              # directory holding allCountries.txt etc.; required for the survey
batch_poll_interval_s: 30       # --batch: how often to check the Batch API job
batch_max_total_wait_s: 86400   # --batch: give up polling after this; re-run to resume
